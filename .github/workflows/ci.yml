name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Manual run from the Actions tab: also builds the desktop apps (without releasing them),
  # to check packaging before tagging a version.
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  # Only the package job needs the Electron binary (~100MB); every other job skips downloading it.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: |
          npx tsc -p tsconfig.json --noEmit
          npx tsc -p tsconfig.frontend.json --noEmit
          npx tsc -p tsconfig.electron.json --noEmit
          npm run typecheck:e2e
      - name: Unit tests (backend + frontend) with coverage
        run: npm run test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: node .github/scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e:
    name: E2E tests (Playwright + Cucumber)
    # macOS because the delete scenarios go through the real macOS Trash (osascript).
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build:
    name: Build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # only used on v* tags, to publish to ghcr.io
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/xavierxee/profolder
          # v1.2.3 tag -> 1.2.3, 1.2 and latest; branches/PRs get a tag that is never pushed.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
      - name: Build (and publish on v* tags)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package:
    name: Desktop app (${{ matrix.name }})
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    needs: [unit, e2e, build, docker]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two separate macOS builds: a native Apple Silicon one (smaller download) and a
          # universal one (Intel + Apple Silicon in one app, roughly twice the size).
          - name: macOS Apple Silicon
            artifact: macos-arm64
            os: macos-latest
            script: dist:mac:arm64
            files: release/*-arm64.dmg
          - name: macOS Universal
            artifact: macos-universal
            os: macos-latest
            script: dist:mac:universal
            files: release/*-universal.dmg
          - name: Windows
            artifact: windows
            os: windows-latest
            script: dist:win
            files: release/*.exe
          - name: Linux
            artifact: linux
            os: ubuntu-latest
            script: dist:linux
            files: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "" # this job does need Electron
      CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned until signing certificates are added
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # The build scripts use `mkdir -p`/`cp`, which cmd.exe (npm's default shell on Windows)
      # doesn't have. Git Bash is preinstalled on the Windows runners.
      - name: Run npm scripts with Git Bash
        if: ${{ runner.os == 'Windows' }}
        run: npm config set script-shell "C:\\Program Files\\Git\\bin\\bash.exe"
      - run: npm ci
      # --publish never: electron-builder would otherwise try to upload to GitHub itself when it
      # detects a tagged CI build; the release job below creates the release instead. On a v*
      # tag, the tag's version (v1.2.3 -> 1.2.3) is stamped into the app and its file names.
      - name: Package
        run: |
          args=(--publish never)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=("-c.extraMetadata.version=${GITHUB_REF_NAME#v}")
          fi
          npm run ${{ matrix.script }} -- "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub Release
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --generate-notes
