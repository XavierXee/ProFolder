<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <!-- Same geometry as components/Logo.tsx: slabs at left 18.75% / width 62.5% / height 12.5%,
       tops 25% / 43.75% / 62.5%, sheared by clip-path polygon(14% 0, 100% 0, 86% 100%, 0 100%). -->
  <defs>
    <linearGradient id="mid" gradientUnits="userSpaceOnUse" x1="30" y1="0" x2="130" y2="0">
      <stop offset="0" stop-color="#FADF82" />
      <stop offset="1" stop-color="#D5F7FE" />
    </linearGradient>
  </defs>
  <rect width="160" height="160" fill="#1C1C1A" />
