appId: com.profolder.app
productName: ProFolder

directories:
  output: release

# This app only ships an English UI, so the ~190 other Chromium locale packs electron-builder
# bundles by default (~49MB) are pure dead weight.
electronLanguages:
  - en

# Only the compiled Electron/backend output and the built frontend are needed at runtime
# (electron/main.ts dynamically imports from dist-electron/src/..., and the embedded server
# serves dist/frontend). Without this allowlist, electron-builder's default "**/*" packed the
# whole repo checkout into app.asar, including raw TS source, e2e/tests/docs/.the assistant, and -
# worse - the real local data/library.db and .env from this machine.
files:
  - dist-electron/**/*
  - dist/frontend/**/*
  - node_modules/**/*
  - package.json
  - "!**/*.map"
  # better-sqlite3 ships prebuilt native binaries for every OS/arch it supports; a mac-only
  # build only ever runs the two darwin ones, so the win32/linux prebuilds (~13MB) are dead
  # weight too.
  - "!node_modules/better-sqlite3/prebuilds/win32-*.node"
  - "!node_modules/better-sqlite3/prebuilds/linux-*.node"
  - "!node_modules/better-sqlite3/prebuilds/linuxmusl-*.node"

mac:
  target: dmg
  icon: build/icon.icns

win:
  target: nsis
  icon: build/icon.ico

linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
